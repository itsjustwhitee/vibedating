name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test "tests/unit/*.test.js"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build site
        env:
          SITE_API: ${{ vars.SITE_API }}
          SITE_LINKS: ${{ vars.SITE_LINKS }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          mkdir _site
          cp -r index.html create.html css js assets _site/
          if [ -n "$SITE_API" ]; then
            sed -i "s|<meta name=\"vibedating-api\" content=\"\">|<meta name=\"vibedating-api\" content=\"$SITE_API\">|" _site/index.html _site/create.html
          fi
          if [ -n "$SITE_LINKS" ]; then
            sed -i "s|<meta name=\"vibedating-links\" content=\"\">|<meta name=\"vibedating-links\" content=\"$SITE_LINKS\">|" _site/index.html _site/create.html
          fi
          if [ -n "$SITE_URL" ]; then
            sed -i "s|content=\"assets/og.png\"|content=\"${SITE_URL}assets/og.png\"|" _site/index.html _site/create.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
